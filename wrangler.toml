name = "schoolnexus"
compatibility_date = "2024-04-01"

[[d1_databases]]
binding = "DB"
database_name = "school-nexus-db"
database_id = "0c7e2517-ca46-4bd7-99a7-421ced6c1b70"
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "school-nexus-assets"

[dev]
port = 3000

# Next.js specific configuration
[env.production]
NEXT_PUBLIC_PLATFORM_DOMAIN = "schoolnexus.com"
